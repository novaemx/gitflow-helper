version: 2

project_name: gitflow

# Per-platform max-performance tuning:
#   - CGO_ENABLED=0                 → static, no glibc coupling, single binary per platform
#   - -trimpath                     → reproducible builds, smaller binaries, no local paths leaked
#   - -pgo=auto                     → activates Profile-Guided Optimization when a default.pgo
#                                    is present in the main package; no-op otherwise. Typical
#                                    5–14% improvement on hot paths once a profile is committed.
#   - -ldflags "-s -w -buildid=none"→ strip DWARF + build ID, faster startup, smaller binary
#   - GOAMD64=v3 (x86_64 only)      → enables AVX2 + FMA + BMI2 instructions. Requires a
#                                    Haswell (2013) or newer CPU. Traded for ~10–20% on
#                                    compute-heavy code. The CLI runs on modern hardware only.
#   - darwin-arm64                  → Go 1.21+ already emits Apple-Silicon-tuned code
#                                    (LSE atomics, NEON FP). No GOARM64 level exists; PGO is
#                                    the main lever.
before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - id: linux-amd64
    main: ./cmd/gitflow
    binary: gitflow
    env:
      - CGO_ENABLED=0
      - GOAMD64=v3
    goos:
      - linux
    goarch:
      - amd64
    flags:
      - -trimpath
      - -pgo=auto
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -buildid=none

  - id: linux-arm64
    main: ./cmd/gitflow
    binary: gitflow
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm64
    flags:
      - -trimpath
      - -pgo=auto
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -buildid=none

  - id: windows-amd64
    main: ./cmd/gitflow
    binary: gitflow
    env:
      - CGO_ENABLED=0
      - GOAMD64=v3
    goos:
      - windows
    goarch:
      - amd64
    flags:
      - -trimpath
      - -pgo=auto
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -buildid=none

  - id: darwin-arm64
    main: ./cmd/gitflow
    binary: gitflow
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - arm64
    flags:
      - -trimpath
      - -pgo=auto
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -buildid=none

# darwin-amd64 (Intel Mac) was removed: discontinued. See CHANGELOG.
# darwin-universal was removed as a derived artifact (depends on darwin-amd64).
archives:
  - id: linux-amd64
    ids:
      - linux-amd64
    name_template: "{{ .ProjectName }}-{{ .Version }}-linux-amd64"
    formats:
      - tar.gz

  - id: linux-aarch64
    ids:
      - linux-arm64
    name_template: "{{ .ProjectName }}-{{ .Version }}-linux-aarch64"
    formats:
      - tar.gz

  - id: windows-amd64
    ids:
      - windows-amd64
    name_template: "{{ .ProjectName }}-{{ .Version }}-windows-amd64"
    formats:
      - zip

  - id: darwin-arm64
    ids:
      - darwin-arm64
    name_template: "{{ .ProjectName }}-{{ .Version }}-darwin-arm64"
    formats:
      - tar.gz

checksum:
  name_template: "checksums.txt"

nfpms:
  - id: linux-packages
    package_name: gitflow-helper
    vendor: novaemx
    homepage: https://github.com/novaemx/gitflow-helper
    maintainer: Luis Lozano
    description: Git Flow workflow helper with interactive TUI and CLI.
    license: MIT
    formats:
      - deb
      - rpm
      - archlinux
    ids:
      - linux-amd64
      - linux-arm64
    bindir: /usr/bin
    contents:
      - src: ./LICENSE
        dst: /usr/share/licenses/gitflow-helper/LICENSE

snapshot:
  version_template: "{{ .Version }}-SNAPSHOT-{{ if eq .ShortCommit \"none\" }}dev{{ else }}{{ .ShortCommit }}{{ end }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: novaemx
    name: gitflow-helper
  draft: false
  prerelease: auto

homebrew_casks:
  - name: gitflow-helper
    ids:
      - darwin-arm64
    binaries:
      - gitflow
    repository:
      owner: novaemx
      name: homebrew-tap
      token: "{{ index .Env \"HOMEBREW_TAP_GITHUB_TOKEN\" }}"
    homepage: "https://github.com/novaemx/gitflow-helper"
    description: "Git Flow workflow helper — interactive TUI + CLI. Only requires git."
    license: "MIT"
    # Upload only when token exists; otherwise keep local generation behavior.
    skip_upload: "{{ if (index .Env \"HOMEBREW_TAP_GITHUB_TOKEN\") }}false{{ else }}true{{ end }}"
